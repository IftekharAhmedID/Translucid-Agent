services:
  - type: web
    name: tracedog-site
    runtime: static
    branch: main
    rootDir: landing
    buildCommand: "npm ci --legacy-peer-deps && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_SUBMISSIONS_URL
        value: https://qlhstbyydtjlrdytapgm.supabase.co/functions/v1/start-investigation
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'self' https://qlhstbyydtjlrdytapgm.supabase.co; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
