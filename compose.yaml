services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: translucid
      POSTGRES_USER: translucid
      POSTGRES_PASSWORD: translucid
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translucid -d translucid"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - translucid-postgres:/var/lib/postgresql/data

volumes:
  translucid-postgres:
